<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 群聊</title>
<style>
  :root{
    --bg:#0b0d12;
    --side:#11141b;
    --main:#0e1116;
    --line:rgba(255,255,255,.07);
    --text:#e6e9ef;
    --dim:#8b93a7;
    --blue:#2b6cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  .app{display:flex;height:100dvh}

  /* ---------- 左栏 ---------- */
  .side{
    width:210px;flex:0 0 210px;background:var(--side);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:16px 12px;
  }
  .brand{font-size:15px;font-weight:600;letter-spacing:.02em;padding:4px 8px 18px}
  .brand small{display:block;font-weight:400;font-size:11px;color:var(--dim);letter-spacing:.06em;margin-top:2px}
  .side-label{font-size:11px;color:var(--dim);letter-spacing:.1em;padding:0 8px 8px}
  .member{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:default}
  .member:hover{background:rgba(255,255,255,.04)}
  .avatar{
    width:30px;height:30px;flex:0 0 30px;border-radius:50%;
    display:grid;place-items:center;font-size:15px;
    background:rgba(255,255,255,.06);
  }
  .member b{font-weight:500;font-size:14px}
  .member i{font-style:normal;font-size:11px;color:var(--dim);margin-left:auto}
  .dot{width:6px;height:6px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84aa}
  .spacer{flex:1}
  .reset{
    border:1px solid var(--line);background:transparent;color:var(--dim);
    padding:8px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;
  }
  .reset:hover{color:var(--text);border-color:rgba(255,255,255,.2)}

  /* ---------- 主区 ---------- */
  .main{flex:1;display:flex;flex-direction:column;background:var(--main);min-width:0}
  header{
    height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;
    padding:0 20px;border-bottom:1px solid var(--line);
  }
  .room{font-weight:600;font-size:15px}
  .status{
    font-size:12px;color:var(--dim);padding:3px 9px;border-radius:20px;
    background:rgba(255,255,255,.05);
  }
  .status.live{color:#8ef0b4;background:rgba(61,220,132,.12)}

  .feed{flex:1;overflow-y:auto;padding:22px 20px 8px;scroll-behavior:smooth}
  .feed::-webkit-scrollbar{width:8px}
  .feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}

  .row{display:flex;gap:10px;margin-bottom:16px;align-items:flex-start}
  .row.me{flex-direction:row-reverse}
  .row .avatar{width:34px;height:34px;flex:0 0 34px;font-size:16px}
  .body{max-width:min(620px,74%)}
  .who{font-size:12px;color:var(--dim);margin:0 4px 4px}
  .row.me .who{text-align:right}
  .bubble{
    padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;
    background:rgba(255,255,255,.045);border:1px solid var(--line);
  }
  .row.me .bubble{
    background:linear-gradient(180deg,#3577ff,#2b62e0);border-color:transparent;
    border-bottom-right-radius:5px;
  }
  .row:not(.me) .bubble{border-bottom-left-radius:5px}

  .sys{text-align:center;margin:14px 0}
  .sys span{
    font-size:12px;color:#7d8598;background:rgba(255,255,255,.04);
    padding:4px 12px;border-radius:20px;
  }
  .sys.err span{color:#ff9a9a;background:rgba(255,80,80,.1)}

  .dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
  .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.35;
          animation:bl 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .empty{color:var(--dim);text-align:center;padding:56px 0 20px}
  .empty h2{font-size:16px;font-weight:500;color:#c3cadb;margin-bottom:6px}
  .empty p{font-size:13px;margin-bottom:22px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 10px}
  .chip{
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:#b8c0d2;
    padding:8px 14px;border-radius:20px;font:inherit;font-size:13px;cursor:pointer;
    transition:.15s;
  }
  .chip:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}

  /* ---------- 输入 ---------- */
  .composer{
    flex:0 0 auto;display:flex;gap:10px;align-items:flex-end;
    padding:12px 20px 18px;border-top:1px solid var(--line);
  }
  textarea{
    flex:1;resize:none;max-height:140px;min-height:44px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;color:var(--text);
    font:inherit;font-size:14px;line-height:1.5;outline:none;
  }
  textarea:focus{border-color:rgba(90,130,255,.6);background:rgba(90,130,255,.06)}
  textarea::placeholder{color:#666e80}
  button.send{
    height:44px;padding:0 20px;border:none;border-radius:12px;cursor:pointer;
    background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:500;
    transition:.15s;
  }
  button.send:hover:not(:disabled){background:#3d7bff}
  button.send:disabled{opacity:.4;cursor:not-allowed}

  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:#232838;border:1px solid var(--line);color:#e6e9ef;
    padding:9px 16px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;
  }
  .toast.on{opacity:1}

  @media (max-width:640px){
    .side{display:none}
    .body{max-width:86%}
    .feed{padding:16px 14px 8px}
    .composer{padding:10px 14px 14px}
    header{padding:0 14px}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">AI 群聊<small>AGENT CREW</small></div>
    <div class="side-label">成员</div>
    <div id="members"></div>
    <div class="spacer"></div>
    <button class="reset" id="reset">清空记录</button>
  </aside>

  <main class="main">
    <header>
      <div class="room">AI 会议室</div>
      <div class="status" id="status">待命</div>
    </header>

    <div class="feed" id="feed">
      <div class="empty" id="empty">
        <h2>给个目标,让他们自己商量</h2>
        <p>发一句话,3 个 agent 会轮流发言,聊完或喊散会自动停。</p>
        <div class="chips">
          <button class="chip">你俩商量一下谁是老大</button>
          <button class="chip">下个月要上线一个算命网站,先把活分了</button>
          <button class="chip">这个 bug 到底该谁修</button>
          <button class="chip">帮我定一下这周学什么</button>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="给个目标,回车开工(Shift+回车换行)"></textarea>
      <button class="send" id="send">发送</button>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const feed    = document.getElementById('feed');
const empty   = document.getElementById('empty');
const input   = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl= document.getElementById('status');
const membersEl = document.getElementById('members');

let AGENTS = [];
const seen = new Set();       // 消息去重(SSE 重连会重放历史)
let typingRow = null;         // 当前"正在输入"那行
let typingTimer = null, typingStart = 0, typingName = '';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- 成员列表 ----------
fetch('/agents').then(r => r.json()).then(list => {
  AGENTS = list;
  membersEl.innerHTML = list.map(a => `
    <div class="member">
      <div class="avatar" style="background:${a.color}22;box-shadow:inset 0 0 0 1px ${a.color}55">${a.emoji}</div>
      <b>${esc(a.name)}</b><span class="dot"></span>
    </div>`).join('');
});

const findAgent = name => AGENTS.find(a => a.name === name) || {color:'#8899bb', emoji:'🤖'};

// ---------- 渲染 ----------
function atBottom(){
  return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
}
function toBottom(force){
  if (force || atBottom()) feed.scrollTop = feed.scrollHeight;
}

function addMsg(m){
  if (m.id !== undefined){
    if (seen.has(m.id)) return false;
    seen.add(m.id);
  }
  empty.style.display = 'none';
  const stick = atBottom();

  let el;
  if (m.who === 'system' || m.who === 'error'){
    el = document.createElement('div');
    el.className = 'sys' + (m.who === 'error' ? ' err' : '');
    el.innerHTML = `<span>${esc(m.text)}</span>`;
  } else {
    const me = m.who === 'user';
    const a  = me ? null : findAgent(m.name);
    el = document.createElement('div');
    el.className = 'row' + (me ? ' me' : '');
    el.innerHTML = `
      ${me ? '' : `<div class="avatar" style="background:${a.color}22;box-shadow:inset 0 0 0 1px ${a.color}55">${a.emoji}</div>`}
      <div class="body">
        <div class="who">${esc(me ? '你' : m.name)} · ${esc(m.ts || '')}</div>
        <div class="bubble" ${me ? '' : `style="border-left:2px solid ${a.color}77"`}>${esc(m.text)}</div>
      </div>`;
  }
  feed.appendChild(el);
  toBottom(stick || m.who === 'user');
  return true;
}

// ---------- 正在输入 ----------
function showTyping(name){
  typingName = name;
  if (!typingRow){
    const a = findAgent(name);
    typingRow = document.createElement('div');
    typingRow.className = 'row';
    typingRow.innerHTML = `
      <div class="avatar" style="background:${a.color}22;box-shadow:inset 0 0 0 1px ${a.color}55">${a.emoji}</div>
      <div class="body">
        <div class="who">${esc(name)} · 正在想</div>
        <div class="bubble" style="color:${a.color}">思考中 <span id="secs">0s</span>
          <span class="dots"><i></i><i></i><i></i></span></div>
      </div>`;
    feed.appendChild(typingRow);
    toBottom(true);
    typingStart = Date.now();
    typingTimer = setInterval(() => {
      const s = document.getElementById('secs');
      if (s) s.textContent = Math.floor((Date.now() - typingStart) / 1000) + 's';
    }, 1000);
  }
}
function clearTyping(){
  if (typingTimer) clearInterval(typingTimer);
  typingTimer = null;
  if (typingRow){ typingRow.remove(); typingRow = null; }
}

function setLive(on){
  statusEl.textContent = on ? '开会中…' : '待命';
  statusEl.classList.toggle('live', on);
  sendBtn.disabled = on;
}

// ---------- SSE ----------
function connect(){
  const es = new EventSource('/stream');
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.who === 'typing'){ setLive(true); showTyping(m.name); return; }
    clearTyping();
    addMsg(m);
    if (m.who === 'user') setLive(true);
    if (m.who === 'system' && /散会|清空/.test(m.text)) setLive(false);
    if (m.who === 'error') setLive(false);
  };
  es.onerror = () => { statusEl.textContent = '连接断开,重连中…'; };
}
connect();

// ---------- 发送 ----------
async function send(){
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = '';
  input.style.height = 'auto';
  const r = await fetch('/say', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text})
  });
  const j = await r.json();
  if (!j.ok) toast(j.msg);
}
sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  input.value = c.textContent;
  input.focus();
  input.dispatchEvent(new Event('input'));
});

document.getElementById('reset').onclick = async () => {
  clearTyping();
  const r = await fetch('/reset', {method:'POST'});
  const j = await r.json();
  if (j.ok){ seen.clear(); feed.innerHTML = ''; feed.appendChild(empty); empty.style.display = ''; setLive(false); }
  else toast(j.msg);
};

let toastTimer;
function toast(t){
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}
</script>
</body>
</html>
